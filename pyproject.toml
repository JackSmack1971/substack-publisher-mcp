[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substack-publisher-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Substack, built directly on python-substack's markdown-native API (not affiliated with Substack Inc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "substack", "publishing", "automation"]
dependencies = [
    "mcp>=1.2.0",
    "python-substack>=0.10.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
substack-publisher-mcp = "substack_publisher_mcp.server:main"
substack-publisher-mcp-setup = "substack_publisher_mcp.setup_auth:main"

[tool.hatch.build.targets.wheel]
packages = ["src/substack_publisher_mcp"]
